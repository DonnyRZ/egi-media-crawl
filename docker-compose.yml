# egi-media-crawl local infra (VPS-shaped: containers for data stores, Node on host).
#
# Host ports (for Node via localhost — match typical .env):
#   Postgres  → 127.0.0.1:5434  →  DATABASE_URL=postgresql://egi:egi@localhost:5434/egi_crawl
#   Redis     → 127.0.0.1:6379  →  REDIS_URL=redis://127.0.0.1:6379
#
# In-compose network hostnames: postgres, redis (e.g. postgresql://egi:egi@postgres:5432/egi_crawl).
# Does NOT use editorial egi-postgres (5433). App/worker is NOT in this compose — run `npm start` on host.
#
#   docker compose up -d
#   docker compose ps
#   docker compose down          # stop containers, keep volumes
#   docker compose down -v       # stop and wipe data volumes

services:
  postgres:
    image: postgres:16-alpine
    container_name: egi-crawl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: egi
      POSTGRES_PASSWORD: egi
      POSTGRES_DB: egi_crawl
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - egi_crawl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egi -d egi_crawl"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: egi-crawl-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - egi_crawl_redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  egi_crawl_pgdata:
  egi_crawl_redisdata:
